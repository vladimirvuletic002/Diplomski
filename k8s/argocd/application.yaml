apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: energy
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/vladimirvuletic002/Diplomski.git
    targetRevision: main
    # Application manifests only platform is installed by bootstrap.sh
    path: k8s/base

  destination:
    server: https://kubernetes.default.svc
    namespace: energy

  ignoreDifferences:
    - group: traefik.io
      kind: TraefikService
      jqPathExpressions:
        - '.spec.weighted.services[].weight'

  syncPolicy:
    automated:
      prune: true
      # Off because demo scripts patch the Rollout directly and self-heal would revert them mid-demo
      selfHeal: false
    syncOptions:
      # Without this, ignoreDifferences only hides the OutOfSync report and a sync still wipes the weights, success reported, traffic split broken
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
