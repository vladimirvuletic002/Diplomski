apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: metering-service
  namespace: energy
  labels:
    version: v3.1.0
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: metering-service
  template:
    metadata:
      labels:
        app: metering-service
    spec:
      containers:
        - name: metering-service
          image: ghcr.io/vladimirvuletic002/diplomski/metering-service:v3.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: PORT
              value: "8081"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
  strategy:
    canary:
      canaryService: metering-service-canary
      stableService: metering-service-stable
      trafficRouting:
        traefik:
          weightedTraefikServiceName: metering-service-weighted
      analysis:
        templates:
          - templateName: success-rate
        startingStep: 1
        args:
          - name: service
            value: metering-service
          - name: version
            valueFrom:
              fieldRef:
                fieldPath: metadata.labels['version']
      steps:
        - setWeight: 10
        - pause: {duration: 60s}
        - setWeight: 25
        - pause: {duration: 30s}
        - setWeight: 50
        - pause: {duration: 30s}
        - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: metering-service-stable
  namespace: energy
spec:
  selector:
    app: metering-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: metering-service-canary
  namespace: energy
spec:
  selector:
    app: metering-service
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: metering-service-weighted
  namespace: energy
spec:
  weighted:
    services:
      - name: metering-service-stable
        port: 8081
        weight: 100
      - name: metering-service-canary
        port: 8081
        weight: 0
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: metering-service
  namespace: energy
spec:
  selector:
    matchLabels:
      app: metering-service
  podMetricsEndpoints:
    - port: http
      path: /metrics
