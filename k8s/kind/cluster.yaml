# kind cluster for the thesis demo. See CLAUDE.md §9-§10.
#
#   kind create cluster --config k8s/kind/cluster.yaml

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: diplomski

nodes:
  - role: control-plane

    # Pinned by digest: a tag can be re-pushed, a digest cannot.
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5

    # The cluster runs inside Docker's network. These mappings forward the host's
    # ports 80 and 443 to the node, where Traefik binds them via hostPort.
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
